name: Testes e executável

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Bibliotecas do Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  executavel-windows:
    needs: testes-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependências
        run: pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Testes no Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Gerar RFQ_Control.exe (PyInstaller) e autoteste
        run: python build.py
      - name: Publicar executável
        uses: actions/upload-artifact@v4
        with:
          name: RFQ_Control-windows
          path: dist/RFQ_Control/
          if-no-files-found: error
          retention-days: 30
